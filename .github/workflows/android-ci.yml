name: Android CI

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install NDK
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Generate Gradle wrapper (if missing)
        run: gradle wrapper --gradle-version 8.10.2 || true

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/assemble.log

      - name: Report compile errors as a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### ❌ Build failed on \`${GITHUB_REF_NAME}\`"
            echo
            echo '```'
            grep -E "^e: |^w: .*(error|unresolved)|error:|FAILURE:|What went wrong|^> |Execution failed for task" /tmp/assemble.log 2>/dev/null | head -80 \
              || echo "no matching lines captured"
            echo '```'
          } > /tmp/comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat /tmp/comment.md)" >/dev/null
          echo "Posted the compile errors as a commit comment."

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: foxyvpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install NDK
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Generate Gradle wrapper (if missing)
        run: gradle wrapper --gradle-version 8.10.2 || true

      - name: Decode signing keystore
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing keystore decoded; the release APK will be signed."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No SIGNING_KEYSTORE_BASE64 secret; the release APK will be unsigned."
          fi

      - name: Assemble release APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Assemble debug APK
        if: steps.signing.outputs.signed != 'true'
        run: ./gradlew assembleDebug --no-daemon

      - name: Remove the decoded keystore
        if: always()
        run: rm -f release-keystore.jks

      # An unsigned APK cannot be installed on Android at all, so publishing one just
      # produces a confusing "app not installed" error. When no signing secret is set we
      # publish the debug-signed build instead: it is signed with the ephemeral debug key,
      # so it installs. Add the SIGNING_KEYSTORE_BASE64 secret to get a properly signed
      # release build whose signature is stable across releases.
      - name: Stage the APKs to publish
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          mkdir -p dist
          if [ "$SIGNED" = "true" ]; then
            cp app/build/outputs/apk/release/*.apk dist/
            echo "Publishing the signed release APK."
          else
            cp app/build/outputs/apk/debug/*.apk dist/
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret; publishing the debug-signed APK so it is installable."
          fi
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
