name: Android CI

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install NDK
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Generate Gradle wrapper (if missing)
        run: gradle wrapper --gradle-version 8.10.2 || true

      # Application.attachBaseContext runs before the ContextImpl knows which Application it
      # belongs to, so context.applicationContext is null there. Anything constructed in that
      # method which reads it throws a NullPointerException and the app crashes before its first
      # frame. This shipped to a user once; the compiler cannot catch it, so grep for it.
      - name: Check attachBaseContext does not read applicationContext
        shell: bash
        run: |
          set -e
          hits=$(find app/src/main/java -name '*.kt' -print0 \
            | xargs -0 awk '/override fun attachBaseContext/,/^    }$/' \
            | grep -n 'applicationContext' || true)
          if [ -n "$hits" ]; then
            echo "::error::attachBaseContext must not touch applicationContext; it is null until super.attachBaseContext returns"
            echo "$hits"
            exit 1
          fi
          echo "OK: no attachBaseContext body reads applicationContext."

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/assemble.log

      - name: Report compile errors as a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### ❌ Build failed on \`${GITHUB_REF_NAME}\`"
            echo
            echo '```'
            grep -E "^e: |^w: .*(error|unresolved)|error:|FAILURE:|What went wrong|^> |Execution failed for task" /tmp/assemble.log 2>/dev/null | head -80 \
              || echo "no matching lines captured"
            echo '```'
          } > /tmp/comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat /tmp/comment.md)" >/dev/null
          echo "Posted the compile errors as a commit comment."

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: foxyvpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;35.0.0"

      - name: Install NDK
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Generate Gradle wrapper (if missing)
        run: gradle wrapper --gradle-version 8.10.2 || true

      - name: Decode signing keystore
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing keystore decoded; the release APK will be signed."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No SIGNING_KEYSTORE_BASE64 secret; the release APK will be unsigned."
          fi

      - name: Assemble release APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Assemble debug APK
        if: steps.signing.outputs.signed != 'true'
        run: ./gradlew assembleDebug --no-daemon

      - name: Remove the decoded keystore
        if: always()
        run: rm -f release-keystore.jks

      # An unsigned APK cannot be installed on Android at all, so publishing one just
      # produces a confusing "app not installed" error. When no signing secret is set we
      # publish the debug-signed build instead: it is signed with the ephemeral debug key,
      # so it installs. Add the SIGNING_KEYSTORE_BASE64 secret to get a properly signed
      # release build whose signature is stable across releases.
      - name: Stage the APKs to publish
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          mkdir -p dist
          if [ "$SIGNED" = "true" ]; then
            cp app/build/outputs/apk/release/*.apk dist/
            echo "Publishing the signed release APK."
          else
            cp app/build/outputs/apk/debug/*.apk dist/
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret; publishing the debug-signed APK so it is installable."
          fi
          ls -la dist

      # Purely informational, so it must never be able to fail the release: GitHub runs `run:`
      # blocks under `bash -e`, and a grep that matches nothing would otherwise abort the job.
      - name: Report the signing certificate
        continue-on-error: true
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set +e
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found; skipping the certificate report." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## APK signature"
            echo ""
            if [ "$SIGNED" = "true" ]; then
              echo "Signed with the repository's release keystore; stable across releases."
            else
              echo "No \`SIGNING_KEYSTORE_BASE64\` secret is set, so this is the **debug** build."
              echo "Gradle generates a fresh debug keystore per runner, so this digest will differ"
              echo "from the previous release and Android will refuse to update in place."
            fi
            echo ""
            echo "| APK | Signer | SHA-256 |"
            echo "| --- | --- | --- |"
            for apk in dist/*.apk; do
              [ -e "$apk" ] || continue
              out=$("$APKSIGNER" verify --print-certs "$apk" 2>&1)
              if [ $? -ne 0 ]; then
                echo "| $(basename "$apk") | **verify failed** | - |"
                continue
              fi
              dn=$(printf '%s' "$out" | grep -m1 "certificate DN" | sed 's/.*DN: //')
              sha=$(printf '%s' "$out" | grep -m1 "SHA-256 digest" | awk '{print $NF}')
              echo "| $(basename "$apk") | ${dn:-unknown} | \`${sha:-unknown}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY" 2>&1
          exit 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

  # Downloads the APK already published on each release and prints the certificate that signed
  # it. Runners can reach the release CDN even though a development sandbox cannot, so this is the
  # only way to tell from outside whether two releases carry the same signature. Android refuses
  # to update in place across different signatures, which shows up to the user as "app not
  # installed" with no explanation.
  inspect-signatures:
    # Also runs on tags: the comparison is only interesting once a release exists, and this
    # sandbox cannot trigger workflow_dispatch (403 on the dispatch endpoint).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0"

      - name: Compare the signature of every published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"

          body=$'### Signing certificate per release\n\n| Release | APK | SHA-256 of signer |\n| --- | --- | --- |\n'
          digests=""
          for tag in $(gh release list --repo "$REPO" --limit 6 | awk '{print $1}'); do
            rm -rf /tmp/apk && mkdir -p /tmp/apk
            if ! gh release download "$tag" --repo "$REPO" --dir /tmp/apk --pattern '*.apk' 2>/dev/null; then
              body+="| $tag | (no APK) | - |"$'\n'; continue
            fi
            for apk in /tmp/apk/*.apk; do
              out=$("$APKSIGNER" verify --print-certs "$apk" 2>&1) || {
                body+="| $tag | $(basename "$apk") | **verify failed** |"$'\n'; continue; }
              sha=$(echo "$out" | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}')
              body+="| $tag | $(basename "$apk") | \`${sha:0:32}…\` |"$'\n'
              digests="$digests $sha"
            done
          done

          unique=$(echo "$digests" | tr ' ' '\n' | grep -c . | tr -d ' ')
          distinct=$(echo "$digests" | tr ' ' '\n' | grep . | sort -u | grep -c . | tr -d ' ')
          body+=$'\n'
          # distinct == 1 is what "they all match" means. Comparing the two counts is backwards:
          # when every APK differs, distinct equals unique and that reads as a match.
          if [ "$distinct" = "1" ] && [ "$unique" != "0" ]; then
            body+="**All $unique APKs share one signature.** Updates should install in place."
          else
            body+="**$distinct different signatures across $unique APKs.** Android will refuse to"
            body+=" update in place between them; the previous version has to be uninstalled first."
            body+=" A stable release keystore (the \`SIGNING_KEYSTORE_BASE64\` secret) fixes this."
          fi

          echo "$body"
          printf '%s' "$body" > /tmp/summary.md
          gh api "repos/$REPO/commits/$SHA/comments" -f body="$(cat /tmp/summary.md)" > /dev/null
